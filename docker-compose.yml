version: '3.9'
services:
  mongo:
    image: mongo:7
    container_name: visadoc-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ai-service:
    image: python:3.12-slim
    container_name: visadoc-ai
    working_dir: /app
    volumes:
      - ./ai_service:/app
    command: bash -lc "apt-get update && apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-khm libgl1 libglib2.0-0 && rm -rf /var/lib/apt/lists/* && pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8001"
    ports:
      - "8002:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - TESSERACT_LANG=eng+khm

volumes:
  mongo_data:
